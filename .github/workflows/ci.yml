name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check required files
        run: |
          test -f src/tspi-theme.css
          test -f install.sh
          test -f LICENSE
          test -f README.md

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n scripts/package.sh

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/package.sh

      - name: Build release package
        run: |
          sh scripts/package.sh
          test -f dist/cockpit-tsi-theme-$(cat VERSION).tar.gz
